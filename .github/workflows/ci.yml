name: CI

# Turns into a visible failure what today fails silently when core.hooksPath
# is not configured on the committer's machine.

on:
  push:
    # `push` fires per pushed REF, not per commit. Without `branches:` a release
    # ran twice on the same commit — once for main, once for the tag pushed
    # right after it. Naming `branches:` excludes tag refs; `'**'` keeps every
    # branch, so a work branch with no PR open is still gated.
    # Accepted residual hole: a tag created on a commit outside main is never
    # tested — acceptable because a tag here is cut from the release commit
    # main has just run green.
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the floating major tag, not a patch: v4 was still running on
      # the Node 20 runtime, whose removal GitHub had already announced. v7 of
      # both is ESM on the current runtime. Neither major breaks this workflow —
      # checkout v7 restricts fork PRs under `pull_request_target`/`workflow_run`
      # and this one triggers on push and pull_request; setup-node v7 only adds
      # cache outputs and drops a dummy NODE_AUTH_TOKEN nothing here reads.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Tests (brainstorm-server, node + shell)
        working-directory: tests/brainstorm-server
        run: |
          npm install
          npm test

      # Every static suite in tests/ runs here: a test that no automated check
      # runs does not block anything, which is the whole point of having it.
      # Each builds its own temporary repository, stubs its own binaries, or
      # reads files directly, so none depends on the checkout's index — they
      # are safe before the rewind below. Live-agent suites stay out on
      # purpose: they cost tokens and are non-deterministic.
      # Invoked through `bash` because this file is mode 100644 in git, unlike
      # every other suite here. Nothing else about it is special.
      - name: Tests (shell lint script)
        run: bash tests/shell-lint/test-lint-shell.sh

      - name: Tests (version bump preflight)
        run: tests/version-bump/test-bump-version.sh

      - name: Tests (session-start hook)
        run: tests/hooks/test-session-start.sh

      - name: Tests (changelog gate)
        run: tests/hooks/test-check-changelog.sh

      - name: Tests (link checker)
        run: tests/hooks/test-check-links.sh

      - name: Tests (skill size gate)
        run: tests/hooks/test-check-skill-size.sh

      - name: Tests (evidence line gate)
        run: tests/hooks/test-check-evidence-line.sh

      - name: Tests (escalation shape gate)
        run: tests/hooks/test-check-escalation-shape.sh

      - name: Tests (no-dispatch gate)
        run: tests/hooks/test-check-no-dispatch.sh

      - name: Tests (cross-reference check)
        run: tests/hooks/test-check-cross-references.sh

      - name: Tests (fence scanner)
        run: tests/hooks/test-mdfence.sh

      - name: Tests (task brief)
        run: tests/hooks/test-task-brief.sh

      - name: Tests (codex plugin sync)
        run: tests/codex-plugin-sync/test-sync-to-codex-plugin.sh

      - name: Tests (antigravity)
        run: tests/antigravity/run-tests.sh

      # The Codex packager reads a git ref, never the working tree. On a CI
      # checkout the two always agree; locally they diverge whenever something
      # is uncommitted, which is why this suite is documented as a
      # run-after-commit one in CLAUDE.md.
      - name: Tests (codex marketplace manifest)
        run: tests/codex/test-marketplace-manifest.sh

      - name: Tests (codex plugin packaging)
        run: tests/codex/test-package-codex-plugin.sh

      - name: Tests (systematic-debugging find-polluter)
        run: tests/systematic-debugging/test-find-polluter.sh

      - name: Tests (kimi)
        run: tests/kimi/run-tests.sh

      # Without --integration the runner skips the two tests that need OpenCode
      # itself installed; the two that remain build their own isolated HOME.
      - name: Tests (opencode)
        run: tests/opencode/run-tests.sh

      - name: Tests (pi extension)
        run: node tests/pi/test-pi-extension.mjs

      # The checks below reuse the repo's own scripts unchanged. All read the
      # git INDEX, because that is what the pre-commit hook reads. A fresh
      # CI checkout has an empty index, so they would inspect nothing.
      # `git reset --soft` rewinds HEAD to the base commit while leaving index
      # and working tree alone — the index then holds exactly what this push or
      # PR changed, and the scripts work as-is with no CI-specific variant.
      # This is why neither gate below needed a --range mode: the range IS the
      # index here.
      #
      # Scope note: the hook enforces the rule per COMMIT; this enforces it over
      # the pushed range as a whole. A push that edits one doc in commit A and
      # the other in commit B passes here and would not have passed the hook.
      - name: Put the pushed range in the index
        env:
          # Via env, never interpolated into the script body: an expression
          # expanded inline is substituted before the shell parses the line.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD)"   # no comparable base: checks no-op
          fi
          git reset --soft "$base"

      - name: Shell lint (files this push changed)
        run: scripts/lint-shell.sh

      - name: Bilingual READMEs stay in sync
        run: scripts/check-docs-sync.sh

      # Both gates lived only in the pre-commit hook, which a clone without
      # `git config core.hooksPath githooks` never runs — the exact silent
      # failure the header of this file says CI exists to make visible. CI
      # tested the scripts and did not apply them.
      - name: Content changes carry a changelog entry
        run: scripts/check-changelog.sh

      - name: The frozen changelog stays frozen
        run: scripts/check-frozen-history.sh

      # Whole-tree, not range-scoped: a link breaks when its destination is
      # removed, which can happen in a commit that touches no scanned file.
      - name: Local links and anchors resolve
        run: scripts/check-links.sh

      # Whole-tree like the link checker, and for the same reason it is not
      # range-scoped: a SKILL.md is over the ceiling or it is not, regardless
      # of which commit put it there.
      - name: Every SKILL.md stays under the line ceiling
        run: scripts/check-skill-size.sh

      # The carriers of the test-evidence line hold one form, copied on purpose
      # because it cannot live behind a link. Without this, "unified in place"
      # is just "copied". The count is printed at run time and written down
      # nowhere: it ages every time a carrier is added.
      - name: The evidence line is the same line everywhere
        run: scripts/check-evidence-line.sh

      # The second copied form, and the reason it needed its own gate: six
      # carriers across five skills, so counting skills undercounts the files
      # that have to agree.
      - name: The escalation shape is the same shape everywhere
        run: scripts/check-escalation-shape.sh

      # The third copied form. subagent-driven-development holds it once per
      # dispatched role, so a list of skill names is not a list of carriers.
      # The count is printed at run time and written down nowhere: it ages
      # every time the list grows.
      - name: The no-dispatch clause is in every review seat
        run: scripts/check-no-dispatch.sh

      # Integrity of the adversarial records only. The tests themselves are
      # never re-run here: they dispatch a live agent, cost tokens, and are
      # non-deterministic. Re-running one is a human decision.
      - name: Adversarial records are well formed
        run: scripts/check-skill-behavior-records.sh
